<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">

  <h1>✨ Quote Generator</h1>

  <select id="category">
    <option value="Motivation">Motivation</option>
    <option value="Success">Success</option>
    <option value="Life">Life</option>
  </select>

  <div class="quote-box fade" id="quoteBox">
    <div class="quote" id="quote"></div>
    <div class="author" id="author"></div>
  </div>

  <div class="buttons">
    <button id="new-quote">🎲 New Quote</button>
    <button id="copy-quote">📋 Copy</button>
    <button id="favorite-quote">❤️ Favourite</button>
    <button id="voice-quote">🔊 Read</button>
    <button id="dark-mode">🌙 Dark Mode</button>
  </div>

  <div class="counter">
    Quotes Generated:
    <span id="count">0</span>
  </div>

  <div class="stats">
    <h3>📊 Statistics</h3>

    <p>
      Total Quotes Viewed:
      <span id="totalViewed">0</span>
    </p>

    <p>
      Favourite Quotes:
      <span id="favoriteCount">0</span>
    </p>

    <p>
      Most Viewed Category:
      <span id="mostViewed">None</span>
    </p>
  </div>

</div>

<script src="assets/js/script.js"></script>

</body>
</html>
